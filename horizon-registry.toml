name = "AutoTools"
summary = "Switches your hotbar to the fastest tool for whatever your crosshair is on — automatically, while you mine."
description = """
AutoTools keeps the right tool in your hand. While you mine, it looks at the block your crosshair
is on and switches your hotbar to the fastest tool you carry for it.

Pickaxe for stone, axe for wood, shovel for dirt, shears for leaves — no more swinging a sword at
a wall, or digging a tunnel with a pickaxe when the shovel is one slot away.

- **Nothing to set up.** Install it and mine. Press `` ` `` to switch it off and on; the key can be
  changed in Options → Mods.
- **You can see what it did.** A short "AutoTools: on" / "AutoTools: off" line appears above the
  hotbar for a couple of seconds, with a quiet click.
- **It only changes one thing:** which hotbar slot is selected. It never moves your items, never
  eats or drinks, never attacks for you.
- **It remembers.** Your on/off choice stays between sessions.

Works on Horizon 26.3.
"""

authors = ["IIOTR1OD"]
